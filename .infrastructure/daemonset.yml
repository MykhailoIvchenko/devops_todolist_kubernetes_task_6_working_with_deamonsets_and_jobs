apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: mate-server
  namespace: mateapp
  labels:
    app: mate-server
spec:
  selector:
    matchLabels:
      app: mate-server
    template:
      metadata:
        labels:
          app: mate-server
      spec:
        containers:
          - name: mate-server
            image: busyboxplus:curl
            command: ["sh", "-c", "while true; do curl http://todoapp-service.todoapp.svc.cluster.local; sleep 5; done"]
            resources:
              requests:
                cpu: "100m"
                memory: "100Mi"
              limits:
                cpu: "200m"
                memory: "200Mi"
            ports:
              - containerPort: 80
                hostPort: 30008